<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi rutina · entrená.</title>
<meta name="theme-color" content="#0C0F0E">
<meta name="robots" content="noindex">
<link rel="icon" href="icono.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono2-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#F0F2ED; --line:#DCE0D8;
  --ink:#0C0F0E; --muted:#5A635E; --accent:#0C0F0E; --accent-ink:#C8F23A; --accent-soft:#ECF5CC;
  --ok:#4D7A0C; --ok-soft:#F1F8DA; --ok-fill:#C8F23A; --ok-ink:#0C0F0E; --ok-line:#9CC31F; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#C0392B;
  --head:#0C0F0E; --head-ink:#F1F4EF; --lima:#C8F23A;
  --display:"Bebas Neue","Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0C0F0E; --surface:#151A18; --surface-2:#1B211F; --line:#2A322E;
  --ink:#F1F4EF; --muted:#9AA39F; --accent:#C8F23A; --accent-ink:#0C0F0E; --accent-soft:#232D14;
  --ok:#C8F23A; --ok-soft:#1C2412; --ok-fill:#C8F23A; --ok-ink:#0C0F0E; --ok-line:#C8F23A; --warn:#EDB15A; --warn-soft:#3A2B12; --bad:#FF6B5E;
  --head:#151A18; --head-ink:#F1F4EF; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-synthesis:none;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--head);color:var(--head-ink);border-bottom:3px solid var(--lima)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pb{display:flex;align-items:center;gap:6px;font-weight:900;font-size:17px;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.pb img{width:24px;height:24px;display:block}
.pb i{font-style:normal;color:var(--lima)}
header .wrap{padding-block:18px 16px}
.hola{font-size:14px;opacity:.85}
h1{font-family:var(--display);font-size:32px;line-height:1.05;margin:2px 0 6px;text-transform:uppercase;letter-spacing:.01em}
.meta{font-size:14px;opacity:.9}
main{padding-block:14px 60px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:12px 14px}
.hint{color:var(--muted);font-size:14px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab.hoy{border-color:var(--ok);color:var(--ok)}
.tab.hoy[aria-pressed="true"]{background:var(--ok-fill);border-color:var(--ok-line);color:var(--ok-ink)}
.semana{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.semana.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.pl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pl-h small{color:var(--warn);font-weight:600;font-size:13px}
.pl-d{display:flex;gap:6px;flex-wrap:wrap}
.pl-c{border:1.5px dashed var(--line);border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600;color:var(--muted)}
.pl-c.si{background:var(--ok-fill);border:1.5px solid var(--ok-line);color:var(--ok-ink)}
.pl-c small{font-weight:500;opacity:.85}
.pl-n{font-size:12.5px;color:var(--muted);font-weight:400}
.fsel{display:flex;flex-direction:column;gap:8px}
.fs-d{display:flex;gap:6px;flex-wrap:wrap}
.fs-c{position:relative;display:flex;flex-direction:column;align-items:center;min-width:52px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;font-weight:700;font-size:14px;text-transform:capitalize;cursor:pointer}
.fs-c small{font-weight:500;font-size:11.5px;color:var(--muted)}
.fs-c[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fs-c[aria-pressed="true"] small{color:var(--accent-ink);opacity:.85}
.fs-otra input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fs-aviso{margin:0;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px}
.fs-aviso .link{color:var(--warn)}
.bl-h{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 6px;border-bottom:1px solid var(--line)}
.bl-n{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.series{font-size:14px;color:var(--muted);font-weight:600}
.ej{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ej:last-child{border-bottom:0}
.ej-top{display:flex;gap:10px;align-items:flex-start}
.ej-n{font-weight:600;font-size:17px;flex:1;min-width:0}
.vbtn{flex:0 0 auto;border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:7px 11px;font-weight:700;font-size:14px}
.datos{display:flex;gap:6px;flex-wrap:wrap}
.d{background:var(--surface-2);border-radius:7px;padding:4px 9px;font-size:14px}
.d b{font-weight:700}
.nota{font-size:14px;color:var(--muted)}
.video{position:relative;width:100%;border-radius:10px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video.v169{aspect-ratio:16/9}.video.v916{aspect-ratio:9/16;max-width:340px;margin:0 auto}
.yt{font-size:13px;color:var(--accent)}
.log{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.log-row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.log label{display:flex;flex-direction:column;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;gap:3px}
.log input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;width:96px}
.log input.n{width:100%}
.rpe{display:flex;gap:4px;flex-wrap:wrap}
.rpe button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-size:14px}
.rpe button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.guardar{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 16px;font-weight:700}
.ult{font-size:13px;color:var(--muted)}
.ok{color:var(--ok);font-weight:600;font-size:14px}
.toggle-log{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;color:var(--ink)}
.msg{padding:28px 18px;text-align:center}
.msg h2{font-family:var(--display);font-size:26px;margin:0 0 6px}
.vistas{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.vista{flex:1;border:0;background:none;border-radius:8px;padding:9px;font-weight:700;font-size:15px;color:var(--muted)}
.vista[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.asis{display:flex;justify-content:space-between;align-items:center;gap:10px}
.asis-btn{flex:1;border:2px dashed var(--ok);background:var(--surface);color:var(--ok);border-radius:10px;padding:12px;font-weight:700;font-size:16px}
.asis.si{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:12px 14px;font-size:15px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px}
.wk{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wk-d{display:flex;gap:5px}
.wk-c{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;border:1.5px solid var(--line);color:var(--muted)}
.wk-c.si{background:var(--ok-fill);border-color:var(--ok-line);color:var(--ok-ink)}
.wk-c.hoy{border-color:var(--accent)}
.p-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bars{display:flex;gap:6px;align-items:flex-end;margin:12px 0 8px}
.bar-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.bar-c b{color:var(--ink);font-size:13px}
.bar-t{width:100%;max-width:34px;height:70px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.bar-t i{display:block;width:100%;background:var(--accent)}
.bar-t i.ok{background:var(--ok-fill)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.chart .lbl{fill:var(--ink);font-size:12px;font-weight:700}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .area{fill:var(--accent-soft)}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.mx{fill:var(--accent)}
.resumen{margin:8px 0 0;font-size:15px}
.bien{display:flex;flex-direction:column;gap:10px}
.bien.si{flex-direction:row;justify-content:space-between;align-items:center;background:var(--ok-soft);color:var(--ok);border-color:transparent;font-size:15px}
.bq{display:flex;flex-direction:column;gap:4px}
.bq span{font-weight:600}
.bq small{font-size:12px;color:var(--muted)}
.bien label{display:flex;flex-direction:column;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;gap:3px}
.bien input{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;width:110px}
.aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600}
details summary{cursor:pointer;font-weight:600}
/* series grandes y ejercicio con kg/reps editables en el lugar */
.series{display:flex;align-items:baseline;gap:5px;font-size:15px;color:var(--muted);font-weight:600;background:var(--surface-2);border-radius:8px;padding:3px 10px}
.series b{font-family:var(--display);font-size:26px;line-height:1;color:var(--ink)}
.ej.hecho{background:var(--ok-soft)}
.ej-top{align-items:center}
.chk{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:transparent;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--ok);color:var(--ok)}
.chk[aria-pressed="true"]{background:var(--ok-fill);border-color:var(--ok-line);color:var(--ok-ink)}
.ej.hecho .ej-n{color:var(--ok)}
.campos{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.campo{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.campo input{width:96px;max-width:100%;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;text-align:center;color:var(--ink)}
.campo input:focus{border-color:var(--accent);outline:none}
.campo input.mod{border-color:var(--warn);color:var(--warn)}
.campos .x{font-family:var(--display);font-size:26px;color:var(--muted);padding-bottom:8px}
.campos .pc{font-size:13px;color:var(--muted);padding-bottom:12px}
.tag-mod{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 7px;align-self:center}
.ej-pie{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mas{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13.5px;padding:0}
.guardando{font-size:13px;color:var(--muted)}
/* ===== Timer / Tabata ===== */
.tmr-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:20;border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:13px 18px;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bl-tm{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:13px;font-weight:700;color:var(--ink);margin-left:8px}
.bl-h .bl-r{display:flex;align-items:center}
#tmr{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);padding:max(14px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overflow:auto}
#tmr[hidden]{display:none}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.t-top h2{font-family:var(--display);font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.02em}
.t-x{border:0;background:rgba(127,127,127,.18);color:inherit;border-radius:10px;padding:8px 14px;font-weight:700;font-size:15px}
.t-cfg{max-width:520px;width:100%;margin:12px auto 0;display:flex;flex-direction:column;gap:12px}
.t-pre{display:flex;gap:6px;flex-wrap:wrap}
.t-pre button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.t-pre button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.t-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.t-row b{font-size:16px}.t-row small{display:block;color:var(--muted);font-size:12.5px}
.t-st{display:flex;align-items:center;gap:8px}
.t-st button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:700}
.t-st output{font-family:var(--display);font-size:30px;font-weight:700;min-width:74px;text-align:center}
.t-ejs{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.t-tot{text-align:center;color:var(--muted);font-size:14px}
.t-go{border:0;background:var(--ok-fill);color:var(--ok-ink);border-radius:14px;padding:16px;font-weight:700;font-size:20px;font-family:var(--display);letter-spacing:.04em;text-transform:uppercase}
#tmr.run{color:#fff}
#tmr.run .t-x{background:rgba(255,255,255,.2)}
#tmr.f-prep{background:#2A322E}#tmr.f-rest{background:#0C0F0E}#tmr.f-work,#tmr.f-fin{background:#C8F23A;color:#0C0F0E}
#tmr.f-rest .t-fase{color:#C8F23A}#tmr.f-rest .t-bar i,#tmr.f-prep .t-bar i,#tmr.f-cr .t-bar i{background:#C8F23A}
#tmr.f-work .t-x,#tmr.f-fin .t-x,#tmr.f-work .t-ctl button,#tmr.f-fin .t-ctl button,#tmr.f-work .tm-b button,#tmr.f-fin .tm-b button{background:rgba(12,15,14,.12);color:#0C0F0E}
#tmr.f-work .t-ctl .t-pp,#tmr.f-fin .t-ctl .t-pp,#tmr.f-work .tm-b button:first-child,#tmr.f-fin .tm-b button:first-child{background:#0C0F0E;color:#C8F23A}
#tmr.f-work .t-bar,#tmr.f-fin .t-bar{background:rgba(12,15,14,.15)}#tmr.f-work .t-bar i,#tmr.f-fin .t-bar i{background:#0C0F0E}
#tmr.f-work .t-kg,#tmr.f-fin .t-kg{background:rgba(12,15,14,.1)}
.t-run{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.t-fase{font-family:var(--display);font-size:clamp(34px,11vw,64px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.t-num{font-family:var(--display);font-weight:700;font-size:clamp(150px,52vw,300px);line-height:.95;font-variant-numeric:tabular-nums}
.t-rnd{font-size:20px;font-weight:600;opacity:.95}
.t-ej{font-size:clamp(22px,7vw,34px);font-weight:700;margin-top:6px}
.t-sig{font-size:16px;opacity:.85}
.t-bar{width:100%;max-width:520px;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:14px}
.t-bar i{display:block;height:100%;background:#fff}
.t-ctl{display:flex;justify-content:center;gap:12px;margin-top:10px}
.t-ctl{width:100%;max-width:520px}
.t-ctl button{flex:1;border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:14px;padding:14px 8px;font-weight:700;font-size:16px;white-space:nowrap}
.t-ctl .t-pp{background:#C8F23A;color:#0C0F0E;flex:1.3}
.bl-timer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}
.bl-go{border:0;background:var(--ok-fill);color:var(--ok-ink);border-radius:10px;padding:10px 16px;font-weight:700;font-size:16px}
.t-plan{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14.5px}
.t-ejs ol{margin:6px 0 0;padding-left:22px;color:var(--ink)}.t-ejs li{margin:2px 0}.t-ejs li span{color:var(--muted);font-weight:600}
.t-kg{font-family:var(--display);font-size:clamp(28px,9vw,44px);font-weight:700;background:rgba(255,255,255,.2);border-radius:12px;padding:2px 16px}
.t-sig b{font-weight:700}
body.tmr-full{overflow:hidden}
body.tmr-on .tmr-fab{display:none}
body.tmr-on:not(.tmr-full) main{padding-bottom:150px}
.t-modos{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.t-modos button{flex:1;border:0;background:none;border-radius:9px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.t-modos button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.t-vista{display:flex;gap:10px;align-items:center;font-size:14.5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.t-vista input{width:20px;height:20px}
.t-tb{display:flex;gap:6px}
.t-top h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-tb .t-x{padding:8px 11px}
.t-tb .t-x{white-space:nowrap}
#tmr.f-cr{background:#1B211F}
.t-num-cr{font-size:clamp(90px,28vw,200px)}
.t-laps{list-style:none;margin:14px 0 0;padding:0;width:100%;max-width:420px;max-height:30vh;overflow:auto}
.t-laps li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.18);font-size:16px}
.t-laps b{font-family:var(--display);font-size:22px}.t-laps small{opacity:.7}
.t-ctl button:disabled{opacity:.45}
#tmr.mini{inset:auto 8px max(8px,env(safe-area-inset-bottom,0px)) 8px;padding:0;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.tm-mini{display:flex;align-items:center;gap:10px;padding:10px 12px 14px;position:relative;flex-wrap:wrap}
.tm-l{flex:1;min-width:0;display:flex;flex-direction:column}
.tm-mini .t-fl{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tm-mini .t-num{font-family:var(--display);font-size:46px;font-weight:700;line-height:1}
.tm-mini .t-ejm{font-size:14.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tm-b{display:flex;gap:5px}
.tm-b button{width:42px;height:42px;border:0;border-radius:12px;background:rgba(255,255,255,.22);color:#fff;font-size:18px;font-weight:700}
.tm-b button:first-child{background:#C8F23A;color:#0C0F0E}
.tm-b button:disabled{opacity:.45}
.tm-mini .t-bar{position:absolute;left:0;right:0;bottom:0;margin:0;height:5px;border-radius:0;max-width:none}
#splash{position:fixed;inset:0;z-index:100;background:#0C0F0E;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease}
#splash.off{opacity:0;pointer-events:none}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:18px;animation:spIn .6s ease both}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 12px 40px rgba(200,242,58,.18)}
#splash .sp-w{font-family:"DM Sans",system-ui,sans-serif;font-weight:900;font-size:40px;letter-spacing:-.04em;color:#F1F4EF;line-height:1}
#splash .sp-w i{font-style:normal;color:#C8F23A}
@keyframes spIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash .sp-in{animation:none}}
.rprog{display:flex;flex-direction:column;gap:8px}
.rp-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rp-t b{font-family:var(--display);font-size:30px;line-height:1;font-weight:400}
.rp-t span{font-size:14px;color:var(--muted)}
.rp-t small{margin-left:auto;font-size:13px;font-weight:700;color:var(--ink)}
.rp-bar{position:relative;height:12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:visible}
.rp-bar i{display:block;height:100%;border-radius:99px;background:var(--ok-fill)}
.rp-bar span{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--surface)}
.rp-bar em{position:absolute;top:-5px;width:2px;height:20px;background:var(--ink);border-radius:2px}
.rp-s{display:flex;justify-content:space-around;font-size:12px;color:var(--muted);font-weight:600}
.rp-s .hoy{color:var(--ink);font-weight:800}
.bien.gate{border:2px solid var(--ok-line)}
.gate-h{display:flex;gap:12px;align-items:flex-start}
.gate-i{flex:0 0 auto;color:var(--ok)}
.gate-h .hint{margin:4px 0 0}
.asis.fin{margin-top:4px}
.aj{display:flex;gap:12px;align-items:flex-start}
.aj div{display:flex;flex-direction:column;gap:2px}
.aj b{font-size:16px}.aj span{font-size:14.5px}.aj small{font-size:12.5px;color:var(--muted)}
.aj-dot{flex:0 0 auto;width:16px;height:16px;border-radius:50%;margin-top:3px}
.aj-verde{border-color:var(--ok-line)}.aj-verde .aj-dot{background:var(--ok-fill);border:2px solid var(--ok-line)}
.aj-amarillo{background:var(--warn-soft);border-color:transparent}.aj-amarillo .aj-dot{background:#E8A317}
.aj-rojo{background:#FBE0DC;border-color:transparent}.aj-rojo .aj-dot{background:#D64545}
@media (prefers-color-scheme:dark){.aj-rojo{background:#3C1C1B}}
.aj-n{font-size:13.5px;border-radius:8px;padding:6px 10px;background:var(--warn-soft)}
.aj-n.aj-rojo{background:#FBE0DC}
@media (prefers-color-scheme:dark){.aj-n.aj-rojo{background:#3C1C1B}}
.aj-n s{color:var(--muted)}
</style>

<body>
<div id="splash" aria-hidden="true"><div class="sp-in"><img src="icono.svg" alt="" width="132" height="132"><span class="sp-w">entrená<i>.</i></span></div></div>
<script>window.splashOff=function(){var s=document.getElementById('splash');if(!s||s.dataset.off)return;s.dataset.off=1;var mn=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)?0:700;var t=Math.max(0,mn-(Date.now()-window.__sp0));setTimeout(function(){s.classList.add('off');setTimeout(function(){s.remove()},450)},t)};window.__sp0=Date.now();setTimeout(window.splashOff,7000);</script>
<header><div class="wrap"><div class="hrow"><div class="hola" id="hola">Cargando…</div><div class="pb"><img src="icono.svg" alt=""><span>entrená<i>.</i></span></div></div><h1 id="titulo">Mi rutina</h1><div class="meta" id="meta"></div></div></header>
<div id="tmr" hidden aria-live="polite"></div>
<main class="wrap" id="main"><div class="card msg"><p class="hint">Cargando tu rutina…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{if(!s)return null;const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const fmt=s=>{const d=parse(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1):''};
const titleCase=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
const token=new URLSearchParams(location.search).get('t')||location.hash.slice(1);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let D=null,sb=null,secI=0,diaI=0,open={},vista='rutina',progEj=null;

function fail(t,h){window.splashOff&&window.splashOff();$('#hola').textContent='';$('#titulo').textContent='Mi rutina';$('#meta').textContent='';$('#main').innerHTML=`<div class="card msg"><h2>${esc(t)}</h2><p class="hint">${esc(h)}</p></div>`}
function rmValue(mov,depth=0){
  if(!mov||depth>5)return null;const v=Number((D.entrenado.rm||{})[mov]);if(v>0)return v;
  const d=(D.rmDefs||[]).find(x=>x.mov===mov);if(d&&d.base){const b=rmValue(d.base,depth+1);return b?b*Number(d.factor||1):null}return null;
}
/* ---- wellness y ajuste de cargas (autorregulación) ---- */
const BK=['sueno','fatiga','dolor','estres','animo'];
function bienVals(d){const o={};BK.forEach(k=>{let v=Number(d&&d[k]);if(!v&&k==='dolor')v=Number(d&&d.cuerpo);if(v)o[k]=v});return o}
function bienProm(d){const v=Object.values(bienVals(d));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
function bienEstado(d,hist){const v=Object.values(bienVals(d));if(!v.length)return null;const m=bienProm(d);
  const hs=(hist||[]).map(bienProm).filter(x=>x!=null);const base=hs.length>=7?hs.reduce((a,b)=>a+b,0)/hs.length:null;const mn=Math.min(...v),dif=base!=null?+(m-base).toFixed(2):0;
  const k=(mn<=1||(base!=null?dif<-1:m<3))?'rojo':(mn<=2||(base!=null?dif<-0.5:m<4))?'amarillo':'verde';
  return {k,m:+m.toFixed(1),base:base!=null?+base.toFixed(1):null}}
const AJ={verde:{pct:0,ser:0,rir:'',lbl:'Óptimo',txt:'Hoy entrenás con la carga planificada.'},amarillo:{pct:-5,ser:0,rir:'1 a 2',lbl:'Moderado',txt:'Ajustamos tus cargas −5% y dejá 1 a 2 repeticiones en reserva.'},rojo:{pct:-10,ser:-1,rir:'3 a 4',lbl:'Bajo',txt:'Ajustamos tus cargas −10%, una serie menos y dejá 3 a 4 repeticiones en reserva.'}};
function histBien(fecha){const d0=new Date(parse(fecha));d0.setDate(d0.getDate()-28);const ini=iso(d0);return (D.registros||[]).filter(r=>r.tipo==='bien'&&r.fecha<fecha&&r.fecha>=ini).map(r=>r.datos)}
function estadoDia(){const r=regHoy('bien:');if(!r)return null;const d=r.datos||{};if(d.estado)return {k:d.estado,m:d.prom,base:d.base??null};return bienEstado(d,histBien(fSel()))}
function ajusteHoy(){const R=D.rutina;if(!R||!R.ajusteWellness)return null;const e=estadoDia();return e&&e.k!=='verde'?{...AJ[e.k],k:e.k,e}:null}
const ajustable=it=>!!(it.pct&&it.rm&&rmValue(it.rm));
const r5=v=>Math.round(v/5)*5;
function blAdj(b){const nn=(v,d)=>{const x=parseInt(v);return x>=0?x:d};const o={w:nn(b.trabajo,40),r:nn(b.descanso,20),n:Math.max(1,nn(b.vueltas,3)),rv:nn(b.pausa,0),ser:parseInt(b.series)||0,cambio:false};const a=ajusteHoy();if(!a)return o;
  if(b.modo==='timer'){if(a.k==='amarillo'){if(o.rv)o.rv=r5(o.rv*1.25);else o.r=r5(o.r*1.25);o.cambio=true}else{o.n0=o.n;o.n=Math.max(1,o.n-1);if(o.n!==o.n0)o.cambio=true}}
  else if(a.ser&&o.ser>=2&&(b.items||[]).some(ajustable)){o.ser0=o.ser;o.ser=o.ser+a.ser;o.cambio=true}
  return o}
function kgBase(it){
  if(it.pct&&it.rm){const rv=rmValue(it.rm);if(rv){const st=Number(D.redondeo)||2.5;return String(+(Math.round(rv*Number(it.pct)/100/st)*st).toFixed(2))}return ''}
  return it.kg||'';
}
function kg(it){const a=ajusteHoy();if(a&&ajustable(it))return kgBase({...it,pct:Math.max(0,Number(it.pct)+a.pct)});return kgBase(it)}
function ytId(u){if(!u)return null;let m=u.match(/shorts\/([\w-]{6,})/)||u.match(/[?&]v=([\w-]{6,})/)||u.match(/youtu\.be\/([\w-]{6,})/)||u.match(/embed\/([\w-]{6,})/);return m?{id:m[1],short:/shorts\//.test(u)}:null}
const regsFor=uid=>(D.registros||[]).filter(r=>r.item===uid).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.ts||0)-(a.ts||0));

const vistaTabs=()=>`<div class="vistas" role="tablist"><button class="vista" data-vista="rutina" aria-pressed="${vista==='rutina'}">Mi rutina</button><button class="vista" data-vista="progreso" aria-pressed="${vista==='progreso'}">Mi progreso</button></div>`;
const isoW=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const asisRegs=()=>(D.registros||[]).filter(r=>String(r.item||'').startsWith('asis:'));
function findItem(uid){for(const s of D.rutina?.secciones||[])for(const d of s.dias||[])for(const b of d.bloques||[])for(const i of b.items||[])if(i.uid===uid)return i;return null}
function semanaHTML(){
  const ini=isoW(today());const set=new Set(asisRegs().map(r=>r.fecha));const L=['L','M','M','J','V','S','D'];
  return `<div class="card pad wk"><b>Esta semana</b><div class="wk-d">${L.map((l,i)=>{const d=new Date(ini);d.setDate(d.getDate()+i);const k=iso(d);const hoy=k===iso(today());return `<span class="wk-c${set.has(k)?' si':''}${hoy?' hoy':''}" title="${fmt(k)}">${set.has(k)?'✓':l}</span>`}).join('')}</div></div>`;
}
function renderProgreso(){
  const E=D.entrenado,est=Number(E.estimulos)||3;
  let h=vistaTabs();
  // asistencia por semana (8 semanas)
  const a=asisRegs();const ws=[];for(let w=7;w>=0;w--){const i=isoW(today());i.setDate(i.getDate()-7*w);const f=new Date(i);f.setDate(f.getDate()+6);const n=new Set(a.filter(r=>r.fecha>=iso(i)&&r.fecha<=iso(f)).map(r=>r.fecha+r.item)).size;ws.push({i,n})}
  const mes=iso(today()).slice(0,7);const nMes=new Set(a.filter(r=>r.fecha.startsWith(mes)).map(r=>r.fecha+r.item)).size;
  h+=`<section class="card pad"><div class="p-h"><b>Asistencia</b><span class="hint">Este mes: <b style="color:var(--ink)">${nMes}</b> ${nMes===1?'entrenamiento':'entrenamientos'}</span></div>
    <div class="bars">${ws.map(w=>`<div class="bar-c"><div class="bar-t"><i style="height:${Math.min(1,w.n/est)*100}%" class="${w.n>=est?'ok':''}"></i></div><b>${w.n}</b><span>${fmt(iso(w.i))}</span></div>`).join('')}</div>
    <p class="hint">Cada barra es una semana. La meta es ${est} por semana. Marcá cada día que entrenes con el botón “Hoy hice este día”.</p></section>`;
  const cr=(D.registros||[]).filter(r=>r.tipo==='carga');
  if(cr.length){const cw=[];for(let w=5;w>=0;w--){const i=isoW(today());i.setDate(i.getDate()-7*w);const f=new Date(i);f.setDate(f.getDate()+6);const v=cr.filter(r=>r.fecha>=iso(i)&&r.fecha<=iso(f)).reduce((a,r)=>a+(Number(r.datos?.min)||0)*(Number(r.datos?.rpe)||0),0);cw.push({i,v})}
    const mx=Math.max(1,...cw.map(w=>w.v));
    h+=`<section class="card pad"><div class="p-h"><b>Carga de entrenamiento</b><span class="hint">minutos × esfuerzo</span></div><div class="bars">${cw.map(w=>`<div class="bar-c"><div class="bar-t"><i style="height:${w.v/mx*100}%"></i></div><b>${w.v}</b><span>${fmt(iso(w.i))}</span></div>`).join('')}</div></section>`}
  // kg por ejercicio
  const g={};for(const r of D.registros||[]){if(/^(asis|carga|bien):/.test(String(r.item||'')))continue;const v=parseFloat(String(r.kg||'').replace(',','.'));if(!(v>0))continue;
    const it=findItem(r.item);const key=r.ej||it?.ej||r.nombre||it?.nombre||r.item;const nom=r.nombre||it?.nombre||'Ejercicio';
    (g[key]=g[key]||{nom,pts:{}});g[key].pts[r.fecha]=Math.max(g[key].pts[r.fecha]||0,v)}
  // los días marcados como hechos cuentan con los kg de la rutina en los ejercicios que no se anotaron
  const anot=new Set((D.registros||[]).map(r=>r.item+'|'+r.fecha));
  for(const a of asisRegs()){if(!D.rutina||a.rutinaId!==D.rutina.id)continue;const du=a.item.slice(5);
    for(const s2 of D.rutina.secciones||[])for(const d of s2.dias||[])if(d.uid===du)for(const b of d.bloques||[])for(const it of b.items||[]){
      if(!it.nombre||anot.has(it.uid+'|'+a.fecha))continue;const v=parseFloat(String(kg(it)||'').replace(',','.'));if(!(v>0))continue;
      const key=it.ej||it.nombre;(g[key]=g[key]||{nom:it.nombre,pts:{}});g[key].pts[a.fecha]=Math.max(g[key].pts[a.fecha]||0,v)}}
  const keys=Object.keys(g).sort((x,y)=>Object.keys(g[y].pts).length-Object.keys(g[x].pts).length);
  if(!keys.length){h+=`<section class="card msg"><h2>Todavía no hay kg anotados</h2><p class="hint">Cuando tildes tus ejercicios, acá vas a ver cómo vas progresando.</p></section>`;$('#main').innerHTML=h;return}
  if(!progEj||!g[progEj])progEj=keys[0];
  const P=Object.entries(g[progEj].pts).sort((x,y)=>x[0].localeCompare(y[0]));
  h+=`<section class="card pad"><div class="p-h"><b>Mis kg</b></div><div class="tabs" style="margin:8px 0">${keys.map(k=>`<button class="tab" data-pej="${esc(k)}" aria-pressed="${k===progEj}">${esc(g[k].nom)}</button>`).join('')}</div>${chart(P)}
    ${P.length>1?`<p class="resumen">${P[P.length-1][1]-P[0][1]>=0?'Subiste':'Bajaste'} <b>${Math.abs(+(P[P.length-1][1]-P[0][1]).toFixed(1))} kg</b> desde el ${fmt(P[0][0])} · Máximo: <b>${Math.max(...P.map(p=>p[1]))} kg</b></p>`:`<p class="resumen">Primer registro: <b>${P[0][1]} kg</b> el ${fmt(P[0][0])}. Seguí anotando para ver tu progreso.</p>`}</section>`;
  $('#main').innerHTML=h;
}
function chart(P){
  const W=340,H=170,l=34,r=12,t=14,b=24;const vs=P.map(p=>p[1]);let lo=Math.min(...vs),hi=Math.max(...vs);if(lo===hi){lo=Math.max(0,lo-5);hi=hi+5}const pad=(hi-lo)*0.15;lo=Math.max(0,lo-pad);hi+=pad;
  const x=i=>P.length===1?(l+W-r)/2:l+i*(W-l-r)/(P.length-1),y=v=>t+(H-t-b)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi].map(v=>Math.round(v));
  const mx=Math.max(...vs);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progreso de kg">
    ${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`).join('')}
    ${P.length>1?`<path d="M${P.map((p,i)=>x(i)+','+y(p[1])).join(' L')} L${x(P.length-1)},${H-b} L${x(0)},${H-b} Z" class="area"/><polyline points="${P.map((p,i)=>x(i)+','+y(p[1])).join(' ')}" class="ln"/>`:''}
    ${P.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p[1])}" r="${i===P.length-1?5:3.5}" class="pt${p[1]===mx?' mx':''}"/>`).join('')}
    <text x="${x(P.length-1)}" y="${y(P[P.length-1][1])-9}" text-anchor="${P.length>1?'end':'middle'}" class="lbl">${P[P.length-1][1]} kg</text>
    <text x="${x(0)}" y="${H-6}" text-anchor="${P.length>1?'start':'middle'}" class="ax">${fmt(P[0][0])}</text>${P.length>1?`<text x="${x(P.length-1)}" y="${H-6}" text-anchor="end" class="ax">${fmt(P[P.length-1][0])}</text>`:''}
  </svg>`;
}
const regHoy=(item)=>(D.registros||[]).find(r=>r.item===item&&r.fecha===fSel());
let editB=false,editC={},draft={},fechaSel=null;
const fSel=()=>fechaSel||iso(today());
const esHoy=()=>fSel()===iso(today());
const DIAS_N=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fLarga=k=>{const d=parse(k);return DIAS_N[d.getDay()]+' '+fmt(k)};
const cuando=()=>esHoy()?'hoy':'el '+fLarga(fSel());
const anchoIn=v=>{const n=String(v||'').length;return n>4?`width:calc(${Math.min(n,12)}ch + 30px);font-size:${n>7?22:26}px`:''};
const BQ=[['sueno','¿Cómo dormiste?','Muy mal','Excelente','sueño'],['fatiga','¿Qué tan cansado te sentís?','Agotado','Con mucha energía','energía'],['dolor','¿Tenés dolor muscular?','Mucho dolor','Sin dolor','dolor'],['estres','¿Cómo está tu nivel de estrés?','Muy estresado','Tranquilo','estrés'],['animo','¿Cómo está tu ánimo?','Muy bajo','Excelente','ánimo']];
function bienHTML(gate){
  const r=regHoy('bien:');const d=r?.datos||{};
  if(r&&!editB){const v=bienVals(d),est=estadoDia();return `<div class="card pad bien si"><span>Wellness ${esHoy()?'de hoy':'del '+fmt(fSel())}: ${BQ.filter(q=>v[q[0]]).map(q=>`${q[4]} <b>${v[q[0]]}</b>`).join(' · ')}${est?` · estado <b>${AJ[est.k].lbl.toLowerCase()}</b>`:''}</span><button class="link" data-editb="1">Cambiar</button></div>`}
  const q=BQ;
  return `<form class="card pad bien${gate?' gate':''}" data-bien="1">${gate?'<div class="gate-h"><svg class="gate-i" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div><b>Completá tu wellness para ver la rutina de hoy</b><p class="hint">Son 5 preguntas rápidas. Lo contestás una vez por día: si se te cierra el link, la rutina queda a la vista.</p></div></div>':`<b>${esHoy()?'Antes de empezar: ¿cómo llegás hoy?':'¿Cómo llegaste el '+esc(fLarga(fSel()))+'?'}</b>`}
    ${q.map(([k,t,a,b])=>`<div class="bq"><span>${t}</span><div class="rpe">${[1,2,3,4,5].map(n=>`<button type="button" data-bv="${k}" data-n="${n}" aria-pressed="${String(d[k])===String(n)}">${n}</button>`).join('')}</div><small>1 = ${a} · 5 = ${b}</small><input type="hidden" name="${k}" value="${esc(d[k]||'')}"></div>`).join('')}
    <div class="log-row"><button class="guardar" type="submit">${gate?'Guardar y ver mi rutina':'Guardar'}</button><span class="ok" data-ok></span></div></form>`;
}
function cargaHTML(dia){

  let c=libre,ejs=[],titulo='Timer',plan=false,blUid=null,fases=[],fi=0,fin=0,rest=0,pausa=false,iv=null,lock=null,ac=null,ultS=-1,estado='cfg';
  let mini=store.get('tmrmini')==='1',cr={run:false,base:0,t0:0,laps:[]};
  const el=()=>$('#tmr');
  const mmss=s=>{s=Math.max(0,Math.ceil(s));return s>=60?Math.floor(s/60)+':'+pad(s%60):String(s)};
  const crTxt=ms=>{const t=Math.floor(ms/100),d=t%10,sg=Math.floor(t/10)%60,m=Math.floor(t/600);return (m?m+':'+pad(sg):String(sg))+'.'+d};
  const K=()=>Math.max(1,ejs.length);
  const total=()=>{if(c.modo==='cd')return c.cd;const g=c.n*K()-1;return c.p+c.n*K()*c.w+Math.max(0,g-(c.n-1))*c.r+Math.max(0,c.n-1)*(c.rv||c.r)};
  const durTxt=()=>mmss(total())+(total()>=60?' min':' seg');
  function beep(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
  const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
  async function wake(on){try{if(on&&'wakeLock' in navigator)lock=await navigator.wakeLock.request('screen');else if(lock){lock.release();lock=null}}catch(e){}}
  const carga=x=>[x.reps?esc(x.reps)+(/\d$/.test(x.reps)?' reps':''):'',x.kg?esc(x.kg)+' kg':''].filter(Boolean).join(' × ');
  function abrir(uid){
    ejs=[];titulo='Timer';plan=false;blUid=null;c=libre;
    if(uid){for(const s2 of D.rutina?.secciones||[])for(const d of s2.dias||[])for(const b of d.bloques||[])if(b.uid===uid){
      titulo=b.nombre||'Bloque';const tm=b.modo==='timer';
      ejs=(b.items||[]).filter(i=>i.nombre).map(i=>{const cur=document.querySelector(`.ej[data-uid="${CSS.escape(i.uid)}"]`)?valores(i.uid):null;return {uid:i.uid,nombre:i.nombre,kg:cur?cur.kg:kg(i),reps:tm?'':(cur?cur.reps:(i.reps||''))}});
      if(tm){plan=true;blUid=uid;const q=blAdj(b);c={w:Math.max(5,q.w),r:q.r,n:q.n,p:10,rv:q.rv,pre:'',modo:'int'}}
      else{const n=blAdj(b).ser;c=Object.assign({},libre,{n:n>0&&n<=50?n:libre.n,rv:0,modo:'int'})}}}
    el().hidden=false;document.body.classList.add('tmr-on');cfg()}
  function cerrar(){stop();cr.run=false;el().hidden=true;el().className='';document.body.classList.remove('tmr-on','tmr-full');estado='cfg'}
  function full(on){document.body.classList.toggle('tmr-full',!!on)}
  function cfg(){
    estado='cfg';full(true);el().className='';
    const st=(k,l,sub,step)=>`<div class="t-row"><div><b>${l}</b><small>${sub}</small></div><div class="t-st"><button data-tst="${k}" data-d="${-step}" aria-label="Menos">−</button><output>${k==='n'?c[k]:mmss(c[k])+(c[k]<60?'"':'')}</output><button data-tst="${k}" data-d="${step}" aria-label="Más">+</button></div></div>`;
    const modos=!plan&&!ejs.length?`<div class="t-modos" role="tablist">${[['int','Intervalos'],['cd','Cuenta regresiva'],['cr','Cronómetro']].map(([k,l])=>`<button data-tmodo="${k}" aria-pressed="${c.modo===k}">${l}</button>`).join('')}</div>`:'';
    let body='';
    if(c.modo==='cr')body=`<div class="t-plan">Cuenta hacia arriba desde 0. Podés marcar vueltas para ver cuánto tardás en cada una.</div>`;
    else if(c.modo==='cd')body=`<div class="t-pre">${CDP.map(v=>`<button data-tcd="${v}" aria-pressed="${c.cd===v}">${v/60} min</button>`).join('')}</div>
      <div class="t-row"><div><b>Minutos</b></div><div class="t-st"><button data-tst="cd" data-d="-60">−</button><output>${Math.floor(c.cd/60)}</output><button data-tst="cd" data-d="60">+</button></div></div>
      <div class="t-row"><div><b>Segundos</b></div><div class="t-st"><button data-tst="cd" data-d="-5">−</button><output>${pad(c.cd%60)}</output><button data-tst="cd" data-d="5">+</button></div></div>
      <div class="t-tot">Duración: <b>${durTxt()}</b></div>`;
    else body=`${plan?`<div class="t-plan">Circuito planificado por tu entrenador: <b>${c.w}" de trabajo y ${c.r}" de descanso por ejercicio, ${c.n} ${c.n===1?'vuelta':'vueltas'}</b>${c.rv?` con ${c.rv}" de pausa entre vueltas`:''}. Al terminar se tildan solos los ejercicios.</div>`:`<div class="t-pre">${PRE.map(([k,l])=>`<button data-tpre="${k}" aria-pressed="${c.pre===k}">${l}</button>`).join('')}</div>`}
      ${st('w','Trabajo',ejs.length?'segundos por ejercicio':'segundos de esfuerzo',5)}${st('r','Descanso',ejs.length?'entre ejercicios':'entre rondas (0 = sin pausa)',5)}${st('n',ejs.length?'Vueltas':'Rondas',ejs.length?`cada vuelta pasa por los ${ejs.length} ejercicios`:'cantidad de intervalos',1)}${ejs.length>1?st('rv','Pausa entre vueltas','0 = igual que el descanso',15):''}${st('p','Preparación','antes de arrancar',5)}
      ${ejs.length?`<div class="t-ejs"><b style="color:var(--ink)">En cada vuelta:</b><ol>${ejs.map(x=>`<li>${esc(x.nombre)}${carga(x)?` <span>${carga(x)}</span>`:''}</li>`).join('')}</ol></div>`:''}
      <div class="t-tot">Duración total: <b>${durTxt()}</b></div>`;
    el().innerHTML=`<div class="t-top"><h2>⏱ ${esc(titulo)}</h2><button class="t-x" data-tx="1">Cerrar</button></div>
    <div class="t-cfg">${modos}${body}
      <label class="t-vista"><input type="checkbox" data-tmini="1" ${mini?'checked':''}> Ver el timer reducido abajo, para seguir viendo la rutina</label>
      <button class="t-go" data-tgo="1">Empezar</button>
      ${c.modo==='cr'?'':'<p class="hint" style="text-align:center">Subí el volumen: suena al cambiar de fase y en los últimos 3 segundos.</p>'}</div>`}
  function armar(){fases=[];if(c.modo==='cd'){fases.push({t:'work',d:Math.max(5,c.cd),cd:true});return}
    if(c.p)fases.push({t:'prep',d:c.p});const k=K(),N=c.n*k;
    for(let x=0;x<N;x++){const v=Math.floor(x/k),j=x%k;fases.push({t:'work',d:c.w,v,j,ej:ejs[j]});
      if(x<N-1){const fv=j===k-1;const d=fv&&c.rv?c.rv:c.r;if(d)fases.push({t:'rest',d,v,j,fv,ej:ejs[(j+1)%k]})}}}
  function go(){if(!plan&&!ejs.length){Object.assign(libre,c);store.set('tmr',JSON.stringify(libre))}
    clearInterval(iv);wake(true);beep(660,.08);pausa=false;
    if(c.modo==='cr'){estado='cr';cr={run:true,base:0,t0:performance.now(),laps:[]};iv=setInterval(tickCr,100);dibujar();return}
    estado='run';armar();fi=0;iniciar(fases[0].d);iv=setInterval(tick,100);dibujar()}
  function iniciar(d){fin=performance.now()+d*1000;ultS=-1}
  function stop(){clearInterval(iv);iv=null;wake(false)}
  function sig(){fi++;if(fi>=fases.length){stop();terminado();return}const f=fases[fi];beep(f.t==='work'?1046:520,f.t==='work'?.35:.25);vib(f.t==='work'?[200,80,200]:300);iniciar(f.d);dibujar()}
  function tick(){if(pausa)return;const r=(fin-performance.now())/1000;if(r<=0){sig();return}const s=Math.ceil(r);if(s!==ultS){ultS=s;if(s<=3)beep(880,.09);const n=el().querySelector('.t-num');if(n)n.textContent=mmss(r);}
    const b=el().querySelector('.t-bar i');if(b)b.style.width=(1-r/fases[fi].d)*100+'%'}
  const crMs=()=>cr.base+(cr.run?performance.now()-cr.t0:0);
  function tickCr(){const n=el().querySelector('.t-num');if(n)n.textContent=crTxt(crMs())}
  const topBar=t=>`<div class="t-top"><h2>${esc(t)}</h2><span class="t-tb"><button class="t-x" data-tmin="1" title="Reducir">⤡ Reducir</button><button class="t-x" data-tx="1">Salir</button></span></div>`;
  const ctl=(extra)=>`<div class="t-ctl"><button data-tctl="reset">↺ Reiniciar</button><button class="t-pp" data-tctl="pp">${pausa?'▶ Seguir':'❚❚ Pausa'}</button>${extra}</div>`;
  function dibujar(){
    if(estado==='cr'){const ms=crMs();full(!mini);el().className='run f-cr'+(mini?' mini':'');
      const laps=cr.laps.map((l,i)=>`<li><span>Vuelta ${i+1}</span><b>${crTxt(l-(cr.laps[i-1]||0))}</b><small>${crTxt(l)}</small></li>`).reverse().join('');
      if(mini){el().innerHTML=`<div class="tm-mini"><div class="tm-l"><span class="t-fl">Cronómetro${cr.laps.length?' · '+cr.laps.length+' vueltas':''}</span><span class="t-num">${crTxt(ms)}</span></div><div class="tm-b"><button data-tctl="pp" aria-label="Pausa">${cr.run?'❚❚':'▶'}</button><button data-tctl="lap" aria-label="Vuelta" ${cr.run?'':'disabled'}>⚑</button><button data-tfull="1" aria-label="Pantalla completa">⤢</button><button data-tx="1" aria-label="Cerrar">✕</button></div></div>`;return}
      el().innerHTML=`${topBar('Cronómetro')}<div class="t-run"><div class="t-fase">${cr.run?'Corriendo':'En pausa'}</div><div class="t-num t-num-cr">${crTxt(ms)}</div>
        <div class="t-ctl"><button data-tctl="reset">↺ Reiniciar</button><button class="t-pp" data-tctl="pp">${cr.run?'❚❚ Pausa':'▶ Seguir'}</button><button data-tctl="lap" ${cr.run?'':'disabled'}>⚑ Vuelta</button></div>
        ${laps?`<ol class="t-laps">${laps}</ol>`:''}</div>`;return}
    const f=fases[fi];const r=pausa?rest:(fin-performance.now())/1000;const k=K();
    full(!mini);el().className='run f-'+f.t+(mini?' mini':'');
    const L=f.cd?'Cuenta regresiva':{prep:'Preparate',work:'¡Trabajo!',rest:f.fv&&c.rv?'Pausa':'Descanso'}[f.t];
    const pos=f.cd?'':f.t==='prep'?(ejs.length?`${c.n} ${c.n===1?'vuelta':'vueltas'} · ${ejs.length} ejercicios · ${c.w}" / ${c.r}"`:`${c.n} rondas · ${c.w}" / ${c.r}"`):(ejs.length?`Vuelta ${f.v+1} de ${c.n}${k>1?` · Ejercicio ${f.j+1} de ${k}`:''}`:`Ronda ${f.v+1} de ${c.n}`);
    const ejT=f.t==='work'&&f.ej?f.ej:f.t!=='work'&&f.ej?f.ej:f.t==='prep'&&ejs.length?ejs[0]:null;
    if(mini){const pc=(1-r/f.d)*100;
      el().innerHTML=`<div class="tm-mini"><div class="tm-l"><span class="t-fl">${pausa?'En pausa':L}${pos?' · '+(ejs.length?`V${f.v!=null?f.v+1:1}/${c.n}${k>1&&f.j!=null?' · E'+(f.j+1)+'/'+k:''}`:f.v!=null?`R${f.v+1}/${c.n}`:''):''}</span><span class="t-num">${mmss(r)}</span>${ejT?`<span class="t-ejm">${f.t==='work'?'':'Sigue: '}${esc(ejT.nombre)}${ejT.kg?' · '+esc(ejT.kg)+' kg':''}</span>`:''}</div>
        <div class="tm-b"><button data-tctl="pp" aria-label="Pausa">${pausa?'▶':'❚❚'}</button>${f.cd?'':'<button data-tctl="skip" aria-label="Saltar">⏭</button>'}<button data-tfull="1" aria-label="Pantalla completa">⤢</button><button data-tx="1" aria-label="Cerrar">✕</button></div>
        <div class="t-bar"><i style="width:${pc}%"></i></div></div>`;return}
    const ej=f.t==='work'&&f.ej?`<div class="t-ej">${esc(f.ej.nombre)}</div>${carga(f.ej)?`<div class="t-kg">${carga(f.ej)}</div>`:''}`:f.t==='rest'&&f.ej?`<div class="t-sig">${f.fv?'Arranca la vuelta '+(f.v+2)+' con:':'Sigue:'} <b>${esc(f.ej.nombre)}</b>${carga(f.ej)?' · '+carga(f.ej):''}</div>`:f.t==='prep'&&ejs.length?`<div class="t-sig">Primero: <b>${esc(ejs[0].nombre)}</b>${carga(ejs[0])?' · '+carga(ejs[0]):''}</div>`:'';
    el().innerHTML=`${topBar(titulo)}
    <div class="t-run"><div class="t-fase">${pausa?'En pausa':L}</div><div class="t-num">${mmss(r)}</div>
      ${pos?`<div class="t-rnd">${pos}</div>`:''}${ej}
      <div class="t-bar"><i style="width:${(1-r/f.d)*100}%"></i></div>
      ${ctl(f.cd?'':'<button data-tctl="skip">Saltar ⏭</button>')}</div>`}
  async function autoTilde(){
    const its=ejs.filter(x=>x.uid&&!regHoy(x.uid));let n=0;
    for(const x of its){const r=await guardarEj(x.uid,{kg:x.kg||'',reps:''});if(!r.error)n++}
    const d=diaDeItem(ejs[0]?.uid);if(d&&!regHoy('asis:'+d.uid)){const a=await logRpc({p_token:token,p_rutina:D.rutina.id,p_item:'asis:'+d.uid,p_fecha:fSel(),p_kg:'',p_reps:'',p_cansancio:null,p_nota:'Asistió',p_ej:'',p_nombre:d.nombre});if(!a.error){D.registros=D.registros.filter(x=>x.id!==a.data.id);D.registros.push(a.data)}}
    render();return n}
  async function terminado(){beep(1046,.2);setTimeout(()=>beep(1318,.4),250);vib([300,100,300,100,500]);estado='fin';
    let msg=ejs.length?'Volvé a la rutina para tildar los ejercicios.':'';
    if(plan){msg='Tildando los ejercicios…';pintaFin(msg);const n=await autoTilde();msg=n?`✓ Se tildaron los ${n} ejercicios del circuito.`:'✓ Los ejercicios ya estaban tildados.'}
    pintaFin(msg)}
  function pintaFin(msg){full(!mini);el().className='run f-fin'+(mini?' mini':'');
    const res=c.modo==='cd'?durTxt():`${ejs.length?`${c.n} ${c.n===1?'vuelta':'vueltas'} · ${ejs.length} ejercicios`:c.n+' rondas'} · ${durTxt()}`;
    if(mini){el().innerHTML=`<div class="tm-mini"><div class="tm-l"><span class="t-fl">¡Terminaste! · ${res}</span>${msg?`<span class="t-ejm">${esc(msg)}</span>`:''}</div><div class="tm-b"><button data-tctl="otra" aria-label="Otra vez">↺</button><button data-tx="1" aria-label="Cerrar">✕</button></div></div>`;return}
    el().innerHTML=`<div class="t-top"><h2>${esc(titulo)}</h2><button class="t-x" data-tx="1">Cerrar</button></div><div class="t-run"><div class="t-fase">¡Terminaste!</div><div class="t-rnd">${res}</div>${msg?`<div class="t-sig">${esc(msg)}</div>`:''}<div class="t-ctl"><button class="t-pp" data-tctl="otra">Otra vez</button><button data-tctl="cfg">Cambiar tiempos</button></div></div>`}
  function setMini(v){mini=v;store.set('tmrmini',v?'1':'0');if(estado==='fin')pintaFin(el().querySelector('.t-sig,.t-ejm')?.textContent||'');else if(estado!=='cfg')dibujar()}
  document.addEventListener('click',ev=>{const t=ev.target;if(!t.closest||!t.closest('#tmr'))return;let b;
    if(b=t.closest('[data-tx]')){cerrar();return}
    if(b=t.closest('[data-tmin]')){setMini(true);return}
    if(b=t.closest('[data-tfull]')){setMini(false);return}
    if(b=t.closest('[data-tmodo]')){c.modo=b.dataset.tmodo;cfg();return}
    if(b=t.closest('[data-tcd]')){c.cd=Number(b.dataset.tcd);cfg();return}
    if(b=t.closest('[data-tpre]')){const p=PRE.find(x=>x[0]===b.dataset.tpre);Object.assign(c,p[2],{pre:p[0]});cfg();return}
    if(b=t.closest('[data-tst]')){const k=b.dataset.tst,lim={w:[5,600],r:[0,600],n:[1,99],p:[0,60],rv:[0,600],cd:[5,5999]}[k];c[k]=Math.min(lim[1],Math.max(lim[0],(c[k]||0)+Number(b.dataset.d)));if(k!=='cd')c.pre='';cfg();return}
    if(b=t.closest('[data-tgo]')){go();return}
    if(b=t.closest('[data-tctl]')){const a=b.dataset.tctl;
      if(estado==='cr'){if(a==='pp'){if(cr.run){cr.base=crMs();cr.run=false}else{cr.t0=performance.now();cr.run=true}}else if(a==='lap'&&cr.run){cr.laps.push(crMs());beep(880,.06)}else if(a==='reset'){cr={run:false,base:0,t0:0,laps:[]}}dibujar();return}
      if(a==='pp'){if(!pausa){rest=(fin-performance.now())/1000;pausa=true}else{pausa=false;fin=performance.now()+rest*1000}dibujar()}
      else if(a==='skip'){pausa=false;sig()}
      else if(a==='reset'){stop();go()}
      else if(a==='otra'){go()}else if(a==='cfg'){cfg()}}});
  document.addEventListener('change',ev=>{const m=ev.target.closest&&ev.target.closest('[data-tmini]');if(m){mini=m.checked;store.set('tmrmini',mini?'1':'0')}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&iv)wake(true)});
  return {abrir};
})();
function alertMsg(t){const m=document.createElement('div');m.className='aviso';m.textContent=t;document.body.appendChild(m);setTimeout(()=>m.remove(),2600)}
document.addEventListener('submit',async ev=>{
  const fb=ev.target.closest('[data-bien]'),fc=ev.target.closest('[data-carga]');
  if(fb||fc){ev.preventDefault();const f=fb||fc,ok=f.querySelector('[data-ok]');let datos;
    if(fb){datos={};BK.forEach(k=>datos[k]=Number(f[k].value));if(BK.some(k=>!datos[k])){ok.textContent='Respondé las cinco preguntas';ok.style.color='var(--bad)';return}
      const est=bienEstado(datos,histBien(fSel()));datos.estado=est.k;datos.prom=est.m;if(est.base!=null)datos.base=est.base}
    else{datos={min:Math.round(Number(String(f.min.value).replace(',','.'))),rpe:Number(f.cansancio.value)};if(!(datos.min>0&&datos.min<600)||!datos.rpe){ok.textContent='Completá minutos y esfuerzo';ok.style.color='var(--bad)';return}}
    ok.textContent='Guardando…';
    try{await dato(fb?'bien':'carga',fb?'':fc.dataset.carga,datos);if(fb)editB=false;else editC[fc.dataset.carga]=false;render()}catch(e){ok.textContent=errTxt(e);ok.style.color='var(--bad)'}
    return}
  const f=ev.target.closest('[data-form]');if(!f)return;ev.preventDefault();
  const uid=f.dataset.form,btn=f.querySelector('.guardar'),ok=f.querySelector('[data-ok]');
  btn.disabled=true;ok.textContent='Guardando…';
  const c=f.cansancio.value;
  const it=findItem(uid)||{};
  const v=valores(uid);
  const {data,error}=await guardarEj(uid,{kg:v.kg,reps:v.reps,cansancio:c?Number(c):null,nota:f.nota.value.trim()});
  btn.disabled=false;
  if(error){ok.textContent=errTxt(error);ok.style.color='var(--bad)';return}
  open[uid]={...open[uid],log:false};render();
});
(async()=>{
  const cfg=window.APP_CONFIG||{};
  if(!token)return fail('Falta tu link personal','Pedile a tu entrenador el link de tu rutina.');
  if(!window.supabase||!cfg.SUPABASE_URL||/PEGAR/.test(cfg.SUPABASE_URL))return fail('La app no está configurada','Avisale a tu entrenador.');
  sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:false}});
  const {data,error}=await sb.rpc('portal_get',{p_token:token});
  if(error)return fail('No pudimos cargar tu rutina','Revisá tu conexión y volvé a abrir el link.');
  if(!data)return fail('Este link no es válido','Pedile a tu entrenador que te lo reenvíe.');
  D=data;D.videos=D.videos||{};
  if(D.rutina){
    const sem=D.rutina.fechaEntrega?Math.floor((today()-parse(D.rutina.fechaEntrega))/6048e5):0;
    const dist=D.rutina.distribucion&&D.rutina.distribucion[sem%D.rutina.distribucion.length];
    const k=D.rutina.id+':'+sem;
    if(store.get('rut')!==k){store.set('rut',k);secI=0;diaI=dist?dist[0]:0;store.set('sec',secI);store.set('dia',diaI)}
    else{secI=Number(store.get('sec'))||0;diaI=Number(store.get('dia'))||0}
  }
  render();
})();
})();
